[package]
name = "maverick_os"
version = "5.0.0"
edition = "2024"
authors = ["Caleb Couch <caleb@orange.me>"]
description = "Maverick OS"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/maverick_os"
documentation = "https://docs.rs/maverick_os"

include = [
    "/src/**/*.rs", "/src/**/*.png", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CALLING.md",
    "/android/java/**/*.java", "/android/AndroidManifest.xml", "/android/bridge/build.gradle",
    "/android/build.gradle", "/android/settings.gradle", "/android/gradle.properties",
    "/android/gradle/**", "/android/gradlew", "/android/gradlew.bat",
]

[features]
demo = ["dep:softbuffer"]

[dependencies]
async-trait = {version = "0.1.88"}
log = {version = "0.4.27"}
raw-window-handle = {version = "0.6.2"}
winit = {package = "ramp-winit", version = "0.30.14", path = "../winit"}
softbuffer = {version = "0.4.6", optional = true}
font8x8 = {version = "0.3.1"}
serde_json = {version = "1.0.140"}
serde = {version="1.0.219", features=["derive", "rc"]}
hex = {version = "0.4.3"}
rand = {version = "0.9.1"}
downcast-rs = {version = "2.0.1"}
image = {version = "0.24.9"}
media = {package = "media2", version = "0.1.0", path = "../media"}
bytemuck = {version = "1.23"}
cpal = {version = "0.16"}
libc = {version = "0.2.172"}

crossfire = {version = "3.1.7"}

postcard = {version = "1.1.3", features = ["alloc"]}
arc-swap = {version = "1.9.2"}
futures = {version = "0.3.34"}
futures-timer = {version = "3.0.3"}
postage = {version = "0.5.0"}

[target.'cfg(target_os = "linux")'.dependencies]
arboard = {version = "3.6", features = ["wayland-data-control"]}
ashpd = {version = "0.13", default-features = false, features = ["tokio", "file_chooser", "open_uri", "notification"]}
url = "2.5"
tempfile = "3"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
souvlaki = {version = "0.8", default-features = false, features = ["use_zbus"]}

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
tempfile = "3"
objc2 = {version = "0.6.5"}
objc2-core-graphics = {version = "0.3.1"}
objc2-user-notifications = {version = "0.3.1"}
objc2-av-foundation = {version = "0.3.2", features = [
    "objc2-core-media", "objc2-core-graphics", "AVAsset", "AVAssetImageGenerator",
]}
objc2-core-audio-types = {version = "0.3.2"}
objc2-core-foundation = {version = "0.3.1"}
objc2-core-media = {version = "0.3.1"}
objc2-foundation = {version = "0.3.1"}
objc2-core-video = {version = "0.3.1"}
dispatch2 = {version = "0.3.0"}
objc2-app-kit = {version = "0.3.1", features = ["objc2-uniform-type-identifiers"]}
objc2-uniform-type-identifiers = {version = "0.3.2"}
objc2-photos-ui = {version = "0.3.2"}
objc2-media-player = {version = "0.3.2"}
block2 = {version = "0.6.2"}

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = {version = "0.3.2"}

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = {version = "0.3.1", features = ["objc2-uniform-type-identifiers"]}
objc2-avf-audio = {version = "0.3.2"}
objc2-quartz-core = {version = "0.3.2"}


[target.'cfg(target_os = "android")'.dependencies]
winit = {package = "ramp-winit", version = "0.30.14", path = "../winit", features = ["android-native-activity"]}
ndk-sys = "0.6"
tokio = {version = "1.45.1", features = ["io-util"]}
android_logger = {version = "0.15.1"}
ndk-context = {version = "0.1.1"}
jni = {version = "0.21.1"}
android-activity = { version = "0.6", features = ["native-activity"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = {version="0.39.0", features=["bundled"]}
tokio = {version="1.45.1", features=["rt-multi-thread", "net", "time", "sync", "macros"]}
tokio-util = {version="0.7.19", features=["rt"]}

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = {version = "0.11.6"}

[package.metadata.deb]
maintainer-scripts = "debian/"

[[bin]]
name = "maverick_os"
path = "src/main.rs"
required-features = ["demo"]
